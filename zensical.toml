[project]
site_name = "aritropc's site"
site_description = "aritropc's personal website"
site_author = "aritropc"
site_url = "https://aritropc.github.io"
nav = [
  { "Hello! 👋" = "index.md" },
]
repo_url = "https://github.com/aritropc/aritropc.github.io"
repo_name = "aritropc/aritropc.github.io"

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]
logo = "assets/images/stewie.png"
favicon = "assets/images/stewie.png"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "lucide/github"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/in/aritropc"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/aritropc"

[[project.extra.social]]
icon = "fontawesome/brands/google-scholar"
link = "https://scholar.google.com/citations?user=aritropc"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/aritropc"


[markdown_extensions]
attr_list = {}